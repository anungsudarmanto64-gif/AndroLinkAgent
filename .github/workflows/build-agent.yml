name: AndroLink Agent Builder

on:
  repository_dispatch:
    types:
      - androlink-agent-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent-template

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # ============================================================
      # 4. GRADLE
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ============================================================
      # 5. INJECT CONFIG PER DEVICE
      # ============================================================
      - name: Inject per-device enrollment configuration
        env:
          CONFIG_JSON: ${{ toJson(github.event.client_payload.config) }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          config = os.environ.get("CONFIG_JSON", "").strip()

          if not config:
              raise SystemExit("CONFIG_JSON kosong.")

          path = Path("app/src/main/assets/androlink-agent.json")

          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(config, encoding="utf-8")

          print("========================================")
          print(" CONFIG INJECTED")
          print("========================================")
          print("File:", path)
          print("Size:", path.stat().st_size, "bytes")
          PY

      # ============================================================
      # 6. VALIDATE CONFIG
      # ============================================================
      - name: Validate enrollment configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/src/main/assets/androlink-agent.json")

          if not path.is_file():
              raise SystemExit("File konfigurasi tidak ditemukan.")

          data = json.loads(path.read_text(encoding="utf-8"))

          required = [
              "app",
              "version",
              "api_base",
              "pair_endpoint",
              "heartbeat_endpoint",
              "device_id",
              "device_token",
              "mode",
              "enrollment_code"
          ]

          missing = [
              key for key in required
              if not data.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Konfigurasi tidak lengkap: "
                  + ", ".join(missing)
              )

          if data["mode"] not in ("temporary", "permanent"):
              raise SystemExit(
                  "Mode enrollment tidak valid: "
                  + str(data["mode"])
              )

          print("========================================")
          print(" CONFIG VALID")
          print("========================================")
          print("Device ID :", data["device_id"])
          print("Mode      :", data["mode"])
          print("API       :", data["api_base"])
          print("Code      :", data["enrollment_code"])
          PY

      # ============================================================
      # 7. BUILD APK
      # ============================================================
      - name: Build APK
        id: build
        run: |
          set -e

          echo "========================================"
          echo " ANDROLINK AGENT BUILD"
          echo "========================================"

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Building APK..."

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug

      # ============================================================
      # 8. LOCATE APK
      # ============================================================
      - name: Locate APK
        id: apk
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "========================================"
          echo " APK FOUND"
          echo "========================================"

          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "APK  : $APK"
          echo "SIZE : $SIZE bytes"

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9. UPLOAD ARTIFACT
      # ============================================================
      - name: Store APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroLink-Agent-${{ github.event.client_payload.job_id }}
          path: agent-template/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 10. PUBLISH APK TO GITHUB RELEASE
      # ============================================================
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -e

          if [ -z "$JOB_ID" ]; then
            echo "ERROR: JOB_ID kosong."
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          TAG="androlink-${JOB_ID}"
          TITLE="AndroLink Agent ${JOB_ID}"

          echo "========================================"
          echo " PUBLISH APK TO GITHUB RELEASE"
          echo "========================================"

          echo "JOB ID : $JOB_ID"
          echo "TAG    : $TAG"
          echo "APK    : $APK_PATH"

          gh release create "$TAG" \
            "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "AndroLink Agent build untuk ${JOB_ID}"

          echo ""
          echo "========================================"
          echo " APK PUBLISHED SUCCESSFULLY"
          echo "========================================"

          gh release view "$TAG" \
            --repo "${{ github.repository }}"
