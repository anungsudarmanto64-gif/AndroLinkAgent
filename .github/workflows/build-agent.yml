      - name: Upload APK to AndroLink server
        id: callback
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -u

          echo "========================================"
          echo " UPLOADING APK TO ANDROLINK"
          echo "========================================"

          if [ -z "${CALLBACK_URL:-}" ]; then
            echo "WARNING: CALLBACK_URL kosong."
            echo "APK tetap tersedia sebagai GitHub Artifact."
            exit 0
          fi

          ls -lh "$APK_PATH"

          RESPONSE_FILE="/tmp/androlink_response.txt"
          HEADER_FILE="/tmp/androlink_headers.txt"

          rm -f "$RESPONSE_FILE" "$HEADER_FILE"

          echo "Callback URL:"
          echo "$CALLBACK_URL"

          echo ""
          echo "Upload started..."

          HTTP_CODE=$(curl \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 180 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --output "$RESPONSE_FILE" \
            --dump-header "$HEADER_FILE" \
            --write-out "%{http_code}" \
            -X POST \
            -F "job_id=${JOB_ID}" \
            -F "token=${CALLBACK_TOKEN}" \
            -F "status=success" \
            -F "apk=@${APK_PATH};type=application/vnd.android.package-archive" \
            "$CALLBACK_URL")

          CURL_CODE=$?

          echo ""
          echo "HTTP STATUS: $HTTP_CODE"
          echo "CURL EXIT: $CURL_CODE"

          echo ""
          echo "SERVER RESPONSE:"
          head -c 4000 "$RESPONSE_FILE" || true
          echo ""

          if [ "$CURL_CODE" -ne 0 ]; then
            echo ""
            echo "WARNING: koneksi ke server gagal."
            echo "APK berhasil dibuat dan tetap tersedia sebagai Artifact."
            exit 0
          fi

          # InfinityFree anti-bot/challenge detection
          if grep -qiE \
            'aes\.js|__test=|This site requires Javascript|slowAES|document\.cookie' \
            "$RESPONSE_FILE"; then

            echo ""
            echo "========================================"
            echo " SERVER BLOCKED BY HOSTING PROTECTION"
            echo "========================================"

            echo "InfinityFree mengembalikan halaman"
            echo "JavaScript/anti-bot, bukan respons API."
            echo ""
            echo "APK berhasil dibuat."
            echo "APK TIDAK dianggap berhasil dikirim ke server."
            echo "APK tetap tersedia sebagai GitHub Artifact."

            exit 0
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo ""
            echo "WARNING: server mengembalikan HTTP $HTTP_CODE."
            echo "APK tetap tersedia sebagai GitHub Artifact."
            exit 0
          fi

          echo ""
          echo "========================================"
          echo " ANDROLINK CALLBACK ACCEPTED"
          echo "========================================"

          exit 0
