name: AndroLink Agent Builder

on:
  repository_dispatch:
    types:
      - androlink-agent-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent-template

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inject per-device enrollment configuration
        env:
          CONFIG_JSON: ${{ toJson(github.event.client_payload.config) }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("app/src/main/assets/androlink-agent.json")
          p.parent.mkdir(parents=True, exist_ok=True)

          config = os.environ.get("CONFIG_JSON", "").strip()

          if not config:
              raise SystemExit("CONFIG_JSON kosong.")

          p.write_text(config, encoding="utf-8")

          print("Config injected:", p)
          print("Config size:", p.stat().st_size, "bytes")
          PY

      - name: Validate enrollment configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("app/src/main/assets/androlink-agent.json")

          if not p.is_file():
              raise SystemExit("File konfigurasi tidak ditemukan.")

          data = json.loads(p.read_text(encoding="utf-8"))

          required = [
              "device_id",
              "device_token",
              "mode",
              "api_base"
          ]

          missing = [key for key in required if not data.get(key)]

          if missing:
              raise SystemExit(
                  "Konfigurasi enrollment tidak lengkap: "
                  + ", ".join(missing)
              )

          if data["mode"] not in ("temporary", "permanent"):
              raise SystemExit("Mode enrollment tidak valid.")

          print("Enrollment configuration valid.")
          print("Device:", data["device_id"])
          print("Mode:", data["mode"])
          print("API:", data["api_base"])
          PY

      - name: Build APK
        id: build
        run: |
          set -e

          echo "========================================"
          echo " ANDROLINK AGENT BUILD"
          echo "========================================"

          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Building APK..."

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug

      - name: Locate APK
        id: apk
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "========================================"
          echo " APK FOUND"
          echo "========================================"

          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")
          SIZE_KB=$((SIZE / 1024))
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1024/1024}")

          echo "APK: $APK"
          echo "SIZE_BYTES=$SIZE"
          echo "SIZE_KB=$SIZE_KB"
          echo "SIZE_MB=$SIZE_MB MB"

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Store APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroLink-Agent-${{ github.event.client_payload.job_id }}
          path: agent-template/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK to AndroLink server
        id: callback
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -u

          echo "========================================"
          echo " UPLOADING APK TO ANDROLINK"
          echo "========================================"

          if [ -z "${CALLBACK_URL:-}" ]; then
            echo "WARNING: CALLBACK_URL kosong."
            echo "APK tetap tersedia sebagai GitHub Artifact."
            exit 0
          fi

          if [ -z "${CALLBACK_TOKEN:-}" ]; then
            echo "WARNING: CALLBACK_TOKEN kosong."
            echo "APK tetap tersedia sebagai GitHub Artifact."
            exit 0
          fi

          if [ -z "${JOB_ID:-}" ]; then
            echo "WARNING: JOB_ID kosong."
            echo "APK tetap tersedia sebagai GitHub Artifact."
            exit 0
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan:"
            echo "$APK_PATH"
            exit 0
          fi

          ls -lh "$APK_PATH"

          RESPONSE_FILE="/tmp/androlink_response.txt"
          HEADER_FILE="/tmp/androlink_headers.txt"

          rm -f "$RESPONSE_FILE" "$HEADER_FILE"

          echo ""
          echo "Upload started..."

          HTTP_CODE=$(curl \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 180 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --output "$RESPONSE_FILE" \
            --dump-header "$HEADER_FILE" \
            --write-out "%{http_code}" \
            -X POST \
            -F "job_id=${JOB_ID}" \
            -F "token=${CALLBACK_TOKEN}" \
            -F "status=success" \
            -F "apk=@${APK_PATH};type=application/vnd.android.package-archive" \
            "$CALLBACK_URL")

          CURL_CODE=$?

          echo ""
          echo "HTTP STATUS: $HTTP_CODE"
          echo "CURL EXIT: $CURL_CODE"

          echo ""
          echo "SERVER RESPONSE:"
          head -c 4000 "$RESPONSE_FILE" || true
          echo ""

          if [ "$CURL_CODE" -ne 0 ]; then
            echo ""
            echo "WARNING: koneksi ke server gagal."
            echo "APK berhasil dibuat dan tetap tersedia sebagai Artifact."
            exit 0
          fi

          if grep -qiE \
            'aes\.js|__test=|This site requires Javascript|slowAES|document\.cookie' \
            "$RESPONSE_FILE"; then

            echo ""
            echo "========================================"
            echo " SERVER BLOCKED BY HOSTING PROTECTION"
            echo "========================================"

            echo "InfinityFree mengembalikan halaman"
            echo "JavaScript/anti-bot, bukan respons API."
            echo ""
            echo "APK berhasil dibuat."
            echo "APK tetap tersedia sebagai GitHub Artifact."

            exit 0
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo ""
            echo "WARNING: server mengembalikan HTTP $HTTP_CODE."
            echo "APK tetap tersedia sebagai GitHub Artifact."
            exit 0
          fi

          echo ""
          echo "========================================"
          echo " ANDROLINK CALLBACK ACCEPTED"
          echo "========================================"

          exit 0
