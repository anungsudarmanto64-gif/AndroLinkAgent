name: AndroLink Agent Builder

on:
  repository_dispatch:
    types: [androlink-agent-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-template

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inject per-device enrollment configuration
        env:
          CONFIG_JSON: ${{ toJson(github.event.client_payload.config) }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('app/src/main/assets/androlink-agent.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(os.environ['CONFIG_JSON'], encoding='utf-8')
          print(f'Config injected: {p}')
          PY

      - name: Validate enrollment configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/src/main/assets/androlink-agent.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          required = ['device_id', 'device_token', 'mode', 'api_base']
          missing = [k for k in required if not data.get(k)]
          if missing:
              raise SystemExit('Konfigurasi enrollment tidak lengkap: ' + ', '.join(missing))
          if data['mode'] not in ('temporary', 'permanent'):
              raise SystemExit('Mode enrollment tidak valid')
          print('Enrollment configuration valid.')
          PY

      - name: Build APK
        id: build
        run: |
          set +e
          gradle --no-daemon --stacktrace assembleDebug
          code=$?
          if [ "$code" -ne 0 ]; then
            curl --fail-with-body -sS -X POST \
              -F "job_id=${{ github.event.client_payload.job_id }}" \
              -F "token=${{ github.event.client_payload.callback_token }}" \
              -F "status=failed" \
              -F "message=Gradle build gagal. Lihat log GitHub Actions." \
              "${{ github.event.client_payload.callback_url }}" || true
            exit "$code"
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK=$APK"

      - name: Upload APK to AndroLink server
        run: |
          curl --fail-with-body -sS -X POST \
            -F "job_id=${{ github.event.client_payload.job_id }}" \
            -F "token=${{ github.event.client_payload.callback_token }}" \
            -F "status=success" \
            -F "apk=@${{ steps.apk.outputs.path }};type=application/vnd.android.package-archive" \
            "${{ github.event.client_payload.callback_url }}"

      - name: Store APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroLink-Agent-${{ github.event.client_payload.job_id }}
          path: agent-template/${{ steps.apk.outputs.path }}
          if-no-files-found: error
